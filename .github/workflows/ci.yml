# Minimal CI: install with uv and run the test suite.
# Runs on x86-64 Linux, where Euphonic is resolved from PyPI (the aarch64 wheel
# workaround in pyproject.toml is skipped by its platform marker).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest  # x86-64; provides `ps` (procps) for AiiDA's scheduler
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v
